<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="images/png" href="images/icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Scared to Speak French? DAILY FRENCH CHALLENGE</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Variable:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Scared to speak French?</h1>
    <p>
      Join our <span class="highlight">FREE</span> WhatsApp group for 
      <span class="highlight">10-seconds</span> of daily French speaking practice. 
      Challenges are <span class="highlight">once a day</span> at a <span class="highlight">random time</span>. 
      Good luck et bon courage 👻
    </p>
    <a href="https://chat.whatsapp.com/B5E2qNGVPl68IZWMIBFrmr" class="cta-button" target="_blank">CHALLENGE ME</a>
  </div>
  <!-- Challenge Timeline -->
  <div class="timeline">
    <h3 id="timeline-title"></h3>
    <div class="timeline-bar" id="timeline-bar"></div>
    <div class="countdown" id="countdown"></div>
    </div>

  <script>
    // Set your challenge start date (year, month-1, day)
    const startDate = new Date(2025, 9, 22); // Example: Oct 20, 2025
    const today = new Date();
    const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24)) + 1;
    const timelineTitle = document.getElementById("timeline-title");
    const timelineBar = document.getElementById("timeline-bar");
    const countdownEl = document.getElementById("countdown");

    const totalDays = 7;

    // Build the timeline dots
    for (let i = 1; i <= totalDays; i++) {
      const dot = document.createElement("div");
      dot.classList.add("day-dot");
      if (i < diffDays) dot.classList.add("complete");
      else if (i === diffDays) dot.classList.add("active");
      timelineBar.appendChild(dot);
    }

    if (diffDays <= totalDays) {
      timelineTitle.textContent = `Day ${Math.min(diffDays, totalDays)} of ${totalDays}`;
    } else {
      timelineTitle.textContent = "✅ Challenge complete!";
      const nextStart = new Date(startDate.getTime() + (14 * 24 * 60 * 60 * 1000)); // next challenge = 7 days after finish

      function updateCountdown() {
        const now = new Date();
        const diff = nextStart - now;
        if (diff <= 0) {
          countdownEl.textContent = "Next challenge starts soon!";
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        countdownEl.textContent = `Next challenge starts in ${days}d ${hours}h ${minutes}m`;
      }

      updateCountdown();
      setInterval(updateCountdown, 60000);
    }
  </script>
</body>
</html>
